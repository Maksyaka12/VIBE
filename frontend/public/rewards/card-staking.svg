<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fcff"/>
      <stop offset="100%" stop-color="#e6f4ff"/>
    </linearGradient>
    <linearGradient id="rocketFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#0052ff"/>
      <stop offset="100%" stop-color="#002699"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0052ff" flood-opacity="0.18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#0038b8" flood-opacity="1"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0052ff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="dogClip">
      <circle cx="980" cy="380" r="280"/>
    </clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Montserrat:wght@900&amp;display=swap');
      .brush-title {
        font-family: 'Permanent Marker', 'Impact', sans-serif;
        font-size: 96px;
        fill: #ffffff;
        stroke: #0052ff;
        stroke-width: 15px;
        paint-order: stroke fill;
        font-weight: 900;
        letter-spacing: 3px;
      }
      .badge-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad2)"/>

  <!-- Asian Geometric Fretwork Corners -->
  <g stroke="#0052ff" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 40 120 L 40 40 L 120 40 M 60 40 L 60 80 L 100 80 M 80 40 L 80 60"/>
    <path d="M 40 600 L 40 680 L 120 680 M 60 680 L 60 640 L 100 640 M 80 680 L 80 660"/>
    <path d="M 1240 120 L 1240 40 L 1160 40 M 1220 40 L 1220 80 L 1180 80 M 1200 40 L 1200 60"/>
  </g>

  <!-- Background Wave Patterns -->
  <g fill="none" stroke="#0052ff" opacity="0.2" stroke-width="3">
    <path d="M -50 640 C 180 520, 320 690, 520 570 C 720 450, 880 660, 1120 530 C 1260 450, 1340 490, 1380 470" stroke-width="6"/>
    <path d="M -50 600 C 120 480, 260 650, 470 530 C 670 410, 820 620, 1070 490 C 1220 410, 1290 450, 1330 430" stroke-width="3"/>
  </g>

  <!-- Rocket Speed Thrust Lines & Trails -->
  <g stroke="#0052ff" stroke-width="5" opacity="0.6" stroke-linecap="round">
    <line x1="180" y1="580" x2="380" y2="420" stroke-width="8"/>
    <line x1="240" y1="620" x2="420" y2="480" stroke-width="4"/>
    <line x1="140" y1="530" x2="320" y2="390" stroke-width="5"/>
    <line x1="300" y1="640" x2="460" y2="520" stroke-width="6"/>
  </g>

  <!-- Dynamic Ink Splash -->
  <g fill="#0052ff">
    <path d="M 100 220 Q 300 150 560 210 Q 320 260 100 220 Z" opacity="0.95"/>
    <path d="M 120 420 Q 360 360 540 410 Q 340 450 120 420 Z" opacity="0.8"/>
    <circle cx="580" cy="190" r="9"/>
    <circle cx="610" cy="220" r="6"/>
    <circle cx="560" cy="240" r="12"/>
    <circle cx="540" cy="380" r="8"/>
    <circle cx="570" cy="410" r="11"/>
  </g>

  <!-- 3D Rocket Icon Graphic -->
  <g transform="translate(420, 100) rotate(35)" filter="url(#dropShadow)">
    <path d="M 50 0 C 80 30 90 90 90 140 L 10 140 C 10 90 20 30 50 0 Z" fill="#ffffff" stroke="#0052ff" stroke-width="8"/>
    <path d="M 50 20 C 65 40 70 80 70 120 L 30 120 C 30 80 35 40 50 20 Z" fill="#00d2ff" opacity="0.4"/>
    <!-- Fins -->
    <path d="M 10 100 L -25 145 L 10 140 Z" fill="#0052ff"/>
    <path d="M 90 100 L 125 145 L 90 140 Z" fill="#0052ff"/>
    <!-- Porthole Window with Dog Face -->
    <circle cx="50" cy="75" r="22" fill="#ffffff" stroke="#0052ff" stroke-width="5"/>
    <image href="/new-logo-vibe.png" x="33" y="58" width="34" height="34"/>
    <!-- Exhaust Flame -->
    <path d="M 25 145 Q 50 210 75 145 Q 50 175 25 145 Z" fill="url(#rocketFire)"/>
  </g>

  <!-- White Fluffy Dog Mascot Container -->
  <g transform="translate(680, 40)" filter="url(#dropShadow)">
    <!-- Great Wave Behind Dog -->
    <path d="M 450 420 C 420 280 320 200 220 240 C 260 210 320 190 380 220 C 440 250 480 320 500 420 Z" fill="#0052ff"/>
    <path d="M 480 460 C 450 320 370 240 280 280 C 320 250 380 230 430 260 C 480 290 510 360 530 460 Z" fill="#00c2ff" opacity="0.7"/>

    <image href="/new design/style__.jfif" x="-50" y="0" width="650" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogClip)"/>

    <circle cx="300" cy="340" r="280" fill="none" stroke="#0052ff" stroke-width="8" opacity="0.3"/>
    <circle cx="300" cy="340" r="286" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="16 8"/>
  </g>

  <!-- Left Side: Dynamic Brush Typography -->
  <g transform="translate(70, 0)" filter="url(#textGlow)">
    <rect x="15" y="190" width="220" height="38" rx="19" fill="#0052ff"/>
    <text x="125" y="215" class="badge-text" text-anchor="middle">2.2M $VIBE POOL</text>

    <!-- Main Title -->
    <text x="15" y="340" class="brush-title" transform="rotate(-3, 15, 340)">STAKING</text>

    <!-- Description Tag -->
    <rect x="20" y="390" width="310" height="42" rx="12" fill="#ffffff" stroke="#0052ff" stroke-width="3"/>
    <text x="175" y="417" font-family="'Montserrat', sans-serif" font-size="16px" font-weight="900" fill="#0052ff" text-anchor="middle" letter-spacing="1px">10-DAY REWARD EPOCHS</text>
  </g>

  <!-- Floating Coins & Multiplier Badges -->
  <g transform="translate(160, 80) rotate(-15)" filter="url(#dropShadow)">
    <circle cx="45" cy="45" r="40" fill="#ffffff" stroke="#0052ff" stroke-width="6"/>
    <circle cx="45" cy="45" r="32" fill="url(#bgGrad2)" stroke="#0052ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="45" y="55" font-family="'Montserrat', sans-serif" font-size="24px" font-weight="900" fill="#0052ff" text-anchor="middle">APY</text>
  </g>

  <g transform="translate(490, 520) rotate(12)" filter="url(#dropShadow)">
    <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#0052ff" stroke-width="7"/>
    <circle cx="50" cy="50" r="36" fill="url(#bgGrad2)" stroke="#0052ff" stroke-width="3"/>
    <image href="/new-logo-vibe.png" x="20" y="20" width="60" height="60"/>
  </g>

  <!-- Frame Border -->
  <rect x="12" y="12" width="1256" height="696" rx="28" fill="none" stroke="#0052ff" stroke-width="4" opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fcff"/>
      <stop offset="100%" stop-color="#ebf6ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0052ff" flood-opacity="0.18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#0038b8" flood-opacity="1"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0052ff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="dogClip">
      <circle cx="980" cy="380" r="280"/>
    </clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Montserrat:wght@900&amp;display=swap');
      .brush-title {
        font-family: 'Permanent Marker', 'Impact', sans-serif;
        font-size: 82px;
        fill: #ffffff;
        stroke: #0052ff;
        stroke-width: 14px;
        paint-order: stroke fill;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Asian Geometric Fretwork Corners -->
  <g stroke="#0052ff" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 40 120 L 40 40 L 120 40 M 60 40 L 60 80 L 100 80 M 80 40 L 80 60"/>
    <path d="M 40 600 L 40 680 L 120 680 M 60 680 L 60 640 L 100 640 M 80 680 L 80 660"/>
    <path d="M 1240 120 L 1240 40 L 1160 40 M 1220 40 L 1220 80 L 1180 80 M 1200 40 L 1200 60"/>
  </g>

  <!-- Background Wave Patterns -->
  <g fill="none" stroke="#0052ff" opacity="0.2" stroke-width="3">
    <path d="M -50 620 C 150 500, 300 680, 500 560 C 700 440, 850 650, 1100 520 C 1250 440, 1320 480, 1350 460" stroke-width="6"/>
    <path d="M -50 660 C 200 540, 350 720, 550 600 C 750 480, 900 690, 1150 560 C 1300 480, 1350 520, 1380 500" stroke-width="4"/>
    <path d="M -50 580 C 100 460, 250 640, 450 520 C 650 400, 800 610, 1050 480 C 1200 400, 1280 440, 1320 420" stroke-width="2"/>
  </g>

  <!-- Dynamic Ink Splash & Speed Streaks -->
  <g fill="#0052ff">
    <path d="M 120 180 Q 320 120 540 170 Q 340 210 120 180 Z" opacity="0.95"/>
    <path d="M 80 340 Q 280 270 510 320 Q 300 370 80 340 Z" opacity="0.85"/>
    <path d="M 150 480 Q 380 420 560 470 Q 370 510 150 480 Z" opacity="0.75"/>
    <circle cx="560" cy="150" r="8"/>
    <circle cx="585" cy="170" r="5"/>
    <circle cx="540" cy="190" r="11"/>
    <circle cx="525" cy="300" r="7"/>
    <circle cx="550" cy="325" r="10"/>
    <circle cx="580" cy="460" r="9"/>
    <circle cx="610" cy="485" r="6"/>
  </g>

  <!-- White Fluffy Dog Mascot Container -->
  <g transform="translate(680, 40)" filter="url(#dropShadow)">
    <path d="M 450 420 C 420 280 320 200 220 240 C 260 210 320 190 380 220 C 440 250 480 320 500 420 Z" fill="#0052ff"/>
    <path d="M 480 460 C 450 320 370 240 280 280 C 320 250 380 230 430 260 C 480 290 510 360 530 460 Z" fill="#00c2ff" opacity="0.7"/>

    <image href="/new design/style__.jfif" x="-50" y="0" width="650" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogClip)"/>

    <circle cx="300" cy="340" r="280" fill="none" stroke="#0052ff" stroke-width="8" opacity="0.3"/>
    <circle cx="300" cy="340" r="286" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="16 8"/>
  </g>

  <!-- Left Side: Dynamic Brush Typography -->
  <g transform="translate(70, 0)" filter="url(#textGlow)">
    <!-- Subtitle Badge -->
    <rect x="15" y="170" width="230" height="38" rx="19" fill="#0052ff"/>
    <text x="130" y="195" class="badge-text" text-anchor="middle">100M REWARDS POOL</text>

    <!-- Main Title -->
    <text x="15" y="295" class="brush-title" transform="rotate(-3, 15, 295)">HOLDER</text>
    <text x="25" y="395" class="brush-title" transform="rotate(-3, 25, 395)">REWARDS</text>

    <!-- Description Tag -->
    <rect x="20" y="440" width="310" height="42" rx="12" fill="#ffffff" stroke="#0052ff" stroke-width="3"/>
    <text x="175" y="467" font-family="'Montserrat', sans-serif" font-size="16px" font-weight="900" fill="#0052ff" text-anchor="middle" letter-spacing="1px">10 VESTING UNLOCKS</text>
  </g>

  <!-- Floating Coins -->
  <g transform="translate(180, 80) rotate(-15)" filter="url(#dropShadow)">
    <circle cx="45" cy="45" r="40" fill="#ffffff" stroke="#0052ff" stroke-width="6"/>
    <circle cx="45" cy="45" r="32" fill="url(#bgGrad)" stroke="#0052ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="45" y="55" font-family="'Montserrat', sans-serif" font-size="28px" font-weight="900" fill="#0052ff" text-anchor="middle">Ð</text>
  </g>

  <g transform="translate(480, 520) rotate(12)" filter="url(#dropShadow)">
    <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#0052ff" stroke-width="7"/>
    <circle cx="50" cy="50" r="36" fill="url(#bgGrad)" stroke="#0052ff" stroke-width="3"/>
    <image href="/new-logo-vibe.png" x="20" y="20" width="60" height="60"/>
  </g>

  <g transform="translate(420, 110)" filter="url(#dropShadow)">
    <polygon points="35,0 70,35 35,70 0,35" fill="#ffffff" stroke="#0052ff" stroke-width="5"/>
    <polygon points="35,12 58,35 35,58 12,35" fill="#00d2ff" opacity="0.8"/>
  </g>

  <!-- Frame Border -->
  <rect x="12" y="12" width="1256" height="696" rx="28" fill="none" stroke="#0052ff" stroke-width="4" opacity="0.3"/>
</svg>

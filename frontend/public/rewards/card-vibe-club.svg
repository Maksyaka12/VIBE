<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fcff"/>
      <stop offset="100%" stop-color="#edf7ff"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0052ff" flood-opacity="0.18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="0" flood-color="#0038b8" flood-opacity="1"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0052ff" flood-opacity="0.35"/>
    </filter>
    <clipPath id="dogClip">
      <circle cx="980" cy="380" r="280"/>
    </clipPath>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&amp;family=Montserrat:wght@900&amp;display=swap');
      .brush-title {
        font-family: 'Permanent Marker', 'Impact', sans-serif;
        font-size: 86px;
        fill: #ffffff;
        stroke: #0052ff;
        stroke-width: 15px;
        paint-order: stroke fill;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 900;
        fill: #ffffff;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad3)"/>

  <!-- Asian Geometric Fretwork Corners -->
  <g stroke="#0052ff" stroke-width="4" fill="none" opacity="0.85">
    <path d="M 40 120 L 40 40 L 120 40 M 60 40 L 60 80 L 100 80 M 80 40 L 80 60"/>
    <path d="M 40 600 L 40 680 L 120 680 M 60 680 L 60 640 L 100 640 M 80 680 L 80 660"/>
    <path d="M 1240 120 L 1240 40 L 1160 40 M 1220 40 L 1220 80 L 1180 80 M 1200 40 L 1200 60"/>
  </g>

  <!-- Background Wave Patterns -->
  <g fill="none" stroke="#0052ff" opacity="0.2" stroke-width="3">
    <path d="M -50 630 C 160 510, 310 680, 510 560 C 710 440, 870 650, 1110 520 C 1250 440, 1330 480, 1370 460" stroke-width="6"/>
    <path d="M -50 590 C 110 470, 250 640, 460 520 C 660 400, 810 610, 1060 480 C 1210 400, 1280 440, 1320 420" stroke-width="3"/>
  </g>

  <!-- Dynamic Ink Splash -->
  <g fill="#0052ff">
    <path d="M 110 190 Q 310 130 550 180 Q 330 230 110 190 Z" opacity="0.95"/>
    <path d="M 90 350 Q 290 280 520 330 Q 310 380 90 350 Z" opacity="0.85"/>
    <circle cx="570" cy="160" r="9"/>
    <circle cx="595" cy="180" r="6"/>
    <circle cx="550" cy="200" r="12"/>
    <circle cx="535" cy="310" r="8"/>
    <circle cx="560" cy="335" r="11"/>
  </g>

  <!-- Royal Crown Graphic -->
  <g transform="translate(420, 110)" filter="url(#dropShadow)">
    <path d="M 0 60 L 20 10 L 50 40 L 80 10 L 100 60 Z" fill="#ffffff" stroke="#0052ff" stroke-width="6"/>
    <circle cx="20" cy="10" r="7" fill="#00d2ff"/>
    <circle cx="50" cy="40" r="7" fill="#0052ff"/>
    <circle cx="80" cy="10" r="7" fill="#00d2ff"/>
    <rect x="0" y="60" width="100" height="18" rx="4" fill="#0052ff"/>
    <circle cx="30" cy="69" r="4" fill="#ffffff"/>
    <circle cx="50" cy="69" r="4" fill="#ffffff"/>
    <circle cx="70" cy="69" r="4" fill="#ffffff"/>
  </g>

  <!-- White Fluffy Dog Mascot Container -->
  <g transform="translate(680, 40)" filter="url(#dropShadow)">
    <path d="M 450 420 C 420 280 320 200 220 240 C 260 210 320 190 380 220 C 440 250 480 320 500 420 Z" fill="#0052ff"/>
    <path d="M 480 460 C 450 320 370 240 280 280 C 320 250 380 230 430 260 C 480 290 510 360 530 460 Z" fill="#00c2ff" opacity="0.7"/>

    <image href="/new design/style__.jfif" x="-50" y="0" width="650" height="650" preserveAspectRatio="xMidYMid slice" clip-path="url(#dogClip)"/>

    <!-- Royal Crown overlay on mascot -->
    <g transform="translate(250, 100) rotate(-10) scale(0.9)" filter="url(#dropShadow)">
      <path d="M 0 50 L 20 10 L 50 35 L 80 10 L 100 50 Z" fill="#ffffff" stroke="#0052ff" stroke-width="6"/>
      <circle cx="20" cy="10" r="6" fill="#00d2ff"/>
      <circle cx="50" cy="35" r="6" fill="#0052ff"/>
      <circle cx="80" cy="10" r="6" fill="#00d2ff"/>
      <rect x="0" y="50" width="100" height="14" rx="3" fill="#0052ff"/>
    </g>

    <circle cx="300" cy="340" r="280" fill="none" stroke="#0052ff" stroke-width="8" opacity="0.3"/>
    <circle cx="300" cy="340" r="286" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="16 8"/>
  </g>

  <!-- Left Side: Dynamic Brush Typography -->
  <g transform="translate(70, 0)" filter="url(#textGlow)">
    <rect x="15" y="170" width="245" height="38" rx="19" fill="#0052ff"/>
    <text x="137" y="195" class="badge-text" text-anchor="middle">15% ROYALTY POOL</text>

    <!-- Main Title -->
    <text x="15" y="295" class="brush-title" transform="rotate(-3, 15, 295)">VIBE</text>
    <text x="25" y="395" class="brush-title" transform="rotate(-3, 25, 395)">CLUB</text>

    <!-- Description Tag -->
    <rect x="20" y="440" width="310" height="42" rx="12" fill="#ffffff" stroke="#0052ff" stroke-width="3"/>
    <text x="175" y="467" font-family="'Montserrat', sans-serif" font-size="16px" font-weight="900" fill="#0052ff" text-anchor="middle" letter-spacing="1px">MEMBERSHIP ROYALTIES</text>
  </g>

  <!-- Floating Coins & Royal Gems -->
  <g transform="translate(170, 80) rotate(-15)" filter="url(#dropShadow)">
    <circle cx="45" cy="45" r="40" fill="#ffffff" stroke="#0052ff" stroke-width="6"/>
    <circle cx="45" cy="45" r="32" fill="url(#bgGrad3)" stroke="#0052ff" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="45" y="55" font-family="'Montserrat', sans-serif" font-size="28px" font-weight="900" fill="#0052ff" text-anchor="middle">👑</text>
  </g>

  <g transform="translate(480, 520) rotate(12)" filter="url(#dropShadow)">
    <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#0052ff" stroke-width="7"/>
    <circle cx="50" cy="50" r="36" fill="url(#bgGrad3)" stroke="#0052ff" stroke-width="3"/>
    <image href="/new-logo-vibe.png" x="20" y="20" width="60" height="60"/>
  </g>

  <!-- Frame Border -->
  <rect x="12" y="12" width="1256" height="696" rx="28" fill="none" stroke="#0052ff" stroke-width="4" opacity="0.3"/>
</svg>
